# WisTable 独立 AI 服务（可插拔）。
# 使用变量 + Docker 内嵌 DNS（127.0.0.11）在「请求时」解析 ai-server，
# 因此 ai-server 未启动/未部署时 nginx 仍可正常启动，请求返回 502，
# 前端 /ai/health 探测失败后自动降级，不影响其它功能。

location = /ai {
  return 308 /ai/;
}

location /ai/ {
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $ai_backend http://ai-server:8001;

  # AI 服务自身路由为根路径（/health、/import/*、/ask），去掉 /ai 前缀
  rewrite ^/ai/(.*)$ /$1 break;
  proxy_pass $ai_backend;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  proxy_connect_timeout 3s;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
}
