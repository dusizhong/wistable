pluginManagement {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        gradlePluginPortal()
    }
}

rootProject.name = 'backend'

include 'code-coverage-report'

include 'shared:core'

include 'application'

file("${rootDir}/shared/starters").eachDirMatch(~/.*/) {
    include "shared:starters:${it.name}"
}
