version: "3.9"

services:
  # ---- infrastructure (ports exposed to host for native dev) ----

  mysql:
    container_name: wistable-mysql-dev
    image: ${IMAGE_MYSQL}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - ${DATA_PATH}/.data/mysql:/var/lib/mysql
      - ./docker/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - TZ=${TIMEZONE}
    command: --default-authentication-plugin=mysql_native_password
      --sql_mode=IGNORE_SPACE,NO_ENGINE_SUBSTITUTION
      --lower_case_table_names=2
    healthcheck:
      test: "mysql ${MYSQL_DATABASE} -uroot -p${MYSQL_ROOT_PASSWORD} --default-character-set=utf8mb4 -e 'SELECT 1;'"
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 60
    networks:
      - dev

  redis:
    container_name: wistable-redis-dev
    image: ${IMAGE_REDIS}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    restart: always
    ports:
      - "6379:6379"
    command:
      [
          "redis-server",
          "--appendonly",
          "yes",
          "--requirepass",
          "${REDIS_PASSWORD}",
      ]
    volumes:
      - ${DATA_PATH}/.data/redis:/data
    environment:
      - TZ=${TIMEZONE}
    networks:
      - dev

  rabbitmq:
    container_name: wistable-rabbitmq-dev
    image: ${IMAGE_RABBITMQ}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ${DATA_PATH}/.data/rabbitmq:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    networks:
      - dev

  minio:
    container_name: wistable-minio-dev
    image: ${IMAGE_MINIO}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server --console-address ":9001" /data
    volumes:
      - ${DATA_PATH}/.data/minio/data:/data
      - ${DATA_PATH}/.data/minio/config:/root/.minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
      - TZ=${TIMEZONE}
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "curl -sS 'http://localhost:9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  init-db:
    container_name: wistable-init-db-dev
    build: ./init-db
    image: ${IMAGE_REGISTRY:-wistable}/init-db:latest
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    environment:
      - TZ=${TIMEZONE}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
    networks:
      - dev
    depends_on:
      mysql:
        condition: service_healthy

  databus-server:
    container_name: wistable-databus-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.databus-server
    image: ${IMAGE_REGISTRY}/${IMAGE_DATABUS_SERVER}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    restart: always
    ports:
      - "8625:8625"
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE}
    networks:
      - dev
    depends_on:
      mysql:
        condition: service_healthy

networks:
  dev:
    name: wistable-dev
    driver: bridge
